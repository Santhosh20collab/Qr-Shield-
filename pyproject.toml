[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrshield"
dynamic = ["version"]
description = "Local-first detection of phishing QR codes (quishing) with a calibrated ML model and explainable rules."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Santh" }]
keywords = ["security", "phishing", "quishing", "qr-code", "machine-learning", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "opencv-python>=4.8",
  "Pillow>=10.0",
  "requests>=2.31",
  "tldextract>=5.1",
  "qrcode[pil]>=7.4",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
training = ["matplotlib>=3.7"]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "matplotlib>=3.7",
]

[project.scripts]
qrshield = "qrshield.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/qr-shield"
Repository = "https://github.com/yourname/qr-shield"
Issues = "https://github.com/yourname/qr-shield/issues"

[tool.setuptools]
packages = ["qrshield", "app"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "qrshield.__version__" }

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["qrshield", "app"]
omit = ["tests/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = [".venv", "data", "artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
