[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrshield"
dynamic = ["version"]
description = "Local-first detection of phishing QR codes (quishing) with a calibrated ML model and explainable rules."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Santh" }]
keywords = ["security", "phishing", "quishing", "qr-code", "machine-learning", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<2.1",
  "pandas>=2.0,<3",
  "scipy>=1.10,<1.14",
  "scikit-learn>=1.5,<1.7",
  "joblib>=1.3,<1.6",
  "opencv-python>=4.8,<5",
  "zxing-cpp>=2.2,<3",
  "Pillow>=10.0,<12",
  "requests>=2.31,<3",
  "tldextract>=5.1,<6",
  "qrcode[pil]>=7.4,<9",
  "fastapi>=0.110,<0.130",
  "uvicorn>=0.27,<0.40",
  "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
training = ["matplotlib>=3.7,<4"]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<8",
  "ruff>=0.5",
  "matplotlib>=3.7,<4",
]

[project.scripts]
qrshield = "qrshield.cli:main"

[project.urls]
Homepage = "https://github.com/Santhosh20collab/Qr-Shield-"
Repository = "https://github.com/Santhosh20collab/Qr-Shield-"
Issues = "https://github.com/Santhosh20collab/Qr-Shield-/issues"

[tool.setuptools]
packages = ["qrshield", "app"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "qrshield.__version__" }

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["qrshield", "app"]
omit = ["tests/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = [".venv", "data", "artifacts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
